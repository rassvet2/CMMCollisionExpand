modLoader = "javafml"
loaderVersion = "[4,)"
# issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "rassvet_ii"
description = "${description}"
logoFile = "assets/cmmce/icon.png"
# logoBlur = false

[[mixins]]
config = "cmmce-common.mixins.json"

[[mixins]]
config = "cmmce-neoforge.mixins.json"

[["dependencies.${id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge},)"
ordering = "NONE"
side = "BOTH"

[["dependencies.${id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft},)"
ordering = "NONE"
side = "BOTH"

[["dependencies.${id}"]]
modId = "architectury"
type = "required"
versionRange = "[${architectury},)"
ordering = "AFTER"
side = "BOTH"

[["dependencies.${id}"]]
modId = "yet_another_config_lib_v3"
mandatory = false
versionRange = "[${yacl},)"
ordering = "NONE"
side = "CLIENT"
